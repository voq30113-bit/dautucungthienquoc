# Build and deploy to GitHub Pages on every push to main (including commits
# made by the scheduled publishing tasks through the Contents API).
#
# Guardrail: `npm run check` (astro check + content lint) and `npm run build`
# (which fails on any frontmatter schema violation) run before the deploy job.
# If either fails, nothing is deployed and the previous site stays live.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A push that lands while a deploy is running waits;
# if several queue up, only the newest is kept, so builds never race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      - name: Check (types + content lint)
        run: npm run check

      - name: Build (Astro + Pagefind)
        run: npm run build
        env:
          # Origin and base path of the Pages site, e.g. https://user.github.io + /repo.
          # Switches automatically when a custom domain is configured.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
